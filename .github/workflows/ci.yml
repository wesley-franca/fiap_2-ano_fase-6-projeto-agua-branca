name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Os testes sobem um MongoDB em container (Testcontainers);
      # o runner do GitHub já vem com Docker disponível.
      - name: Testes
        working-directory: backend
        run: ./mvnw -B test

      - name: Empacotar
        working-directory: backend
        run: ./mvnw -B package -DskipTests

  app:
    name: App (APK debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache do Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/**/*.gradle.kts', 'app/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Compilar o APK
        working-directory: app
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/app/build/outputs/apk/debug/app-debug.apk
