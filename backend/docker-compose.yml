name: inovacao

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/inovacao}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
